<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Growzio — Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --g-dark:    #0a2e14;
      --g-deep:    #0f4020;
      --g-mid:     #1a6635;
      --g-bright:  #22c55e;
      --g-lime:    #86efac;
      --g-glow:    #bbf7d0;
      --white:     #ffffff;
      --off-white: #f0fdf4;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--g-dark);
      color: var(--white);
      overflow-x: hidden;
    }

    /* ── Background mesh ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, #1a6635aa 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 90%, #22c55e33 0%, transparent 55%),
        radial-gradient(ellipse 40% 40% at 50% 50%, #0f4020 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Grid lines ── */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(34,197,94,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34,197,94,.06) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Layout ── */
    .page {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 48px 24px;
      text-align: center;
    }

    /* ── Logo badge ── */
    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(34,197,94,.12);
      border: 1px solid rgba(34,197,94,.35);
      border-radius: 100px;
      padding: 6px 16px;
      font-size: 13px; font-weight: 600; letter-spacing: .08em;
      color: var(--g-lime);
      text-transform: uppercase;
      margin-bottom: 36px;
    }
    .badge-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--g-bright);
      animation: pulse 1.8s ease-in-out infinite;
    }

    /* ── Logo ── */
    .logo {
      font-family: 'Syne', sans-serif;
      font-size: clamp(56px, 12vw, 108px);
      font-weight: 800;
      letter-spacing: -.03em;
      line-height: 1;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #ffffff 0%, #86efac 55%, #22c55e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-size: clamp(15px, 2.5vw, 18px);
      color: rgba(255,255,255,.55);
      font-weight: 400;
      max-width: 380px;
      line-height: 1.6;
      margin-bottom: 60px;
    }

    /* ── Launch date label ── */
    .launch-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--g-bright);
      margin-bottom: 20px;
    }

    /* ── Countdown ── */
    .countdown {
      display: flex; gap: 16px; flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 64px;
    }

    .unit {
      display: flex; flex-direction: column; align-items: center;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(34,197,94,.2);
      border-radius: 16px;
      padding: 20px 28px;
      min-width: 90px;
      backdrop-filter: blur(8px);
    }

    .unit-num {
      font-family: 'Syne', sans-serif;
      font-size: clamp(36px, 7vw, 56px);
      font-weight: 700;
      line-height: 1;
      color: var(--white);
      transition: color .2s;
    }
    .unit-num.tick { color: var(--g-bright); }

    .unit-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(255,255,255,.35);
      margin-top: 8px;
    }

    /* ── Separator ── */
    .sep {
      font-family: 'Syne', sans-serif;
      font-size: 40px;
      font-weight: 700;
      color: rgba(34,197,94,.4);
      align-self: center;
      padding-bottom: 22px;
      user-select: none;
    }

    /* ── Progress bar ── */
    .progress-wrap {
      width: min(400px, 90vw);
      margin-bottom: 64px;
    }
    .progress-meta {
      display: flex; justify-content: space-between;
      font-size: 12px; color: rgba(255,255,255,.35);
      margin-bottom: 8px;
    }
    .progress-track {
      height: 4px; background: rgba(255,255,255,.08);
      border-radius: 100px; overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--g-mid), var(--g-bright));
      border-radius: 100px;
      transition: width .8s ease;
    }

    /* ── Notify form ── */
    .notify-label {
      font-size: 13px; color: rgba(255,255,255,.45);
      margin-bottom: 14px;
    }
    .notify-form {
      display: flex; gap: 8px; flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 48px;
    }
    .notify-input {
      flex: 1; min-width: 220px; max-width: 300px;
      padding: 12px 18px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(34,197,94,.25);
      border-radius: 10px;
      color: var(--white);
      font-size: 14px;
      outline: none;
      transition: border-color .2s;
    }
    .notify-input::placeholder { color: rgba(255,255,255,.3); }
    .notify-input:focus { border-color: var(--g-bright); }

    .notify-btn {
      padding: 12px 22px;
      background: var(--g-bright);
      color: var(--g-dark);
      font-weight: 700; font-size: 14px;
      border: none; border-radius: 10px;
      cursor: pointer;
      transition: background .2s, transform .1s;
      white-space: nowrap;
    }
    .notify-btn:hover { background: var(--g-lime); }
    .notify-btn:active { transform: scale(.97); }

    /* ── Footer ── */
    .footer {
      font-size: 12px;
      color: rgba(255,255,255,.2);
      letter-spacing: .04em;
    }
    .footer span { color: var(--g-bright); }

    /* ── Animations ── */
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .5; transform: scale(.7); }
    }

    @media (max-width: 480px) {
      .unit { min-width: 70px; padding: 16px 18px; }
      .sep { font-size: 28px; }
    }
  </style>
</head>
<body>
<div class="page">

  <div class="badge">
    <span class="badge-dot"></span>
    Something big is coming
  </div>

  <div class="logo">Growzio</div>
  <p class="tagline">We're building something powerful. Get ready to grow like never before.</p>

  <p class="launch-label">Launching on — 5 July 2026</p>

  <div class="countdown">
    <div class="unit"><span class="unit-num" id="cd-days">00</span><span class="unit-label">Days</span></div>
    <div class="sep">:</div>
    <div class="unit"><span class="unit-num" id="cd-hours">00</span><span class="unit-label">Hours</span></div>
    <div class="sep">:</div>
    <div class="unit"><span class="unit-num" id="cd-mins">00</span><span class="unit-label">Minutes</span></div>
    <div class="sep">:</div>
    <div class="unit"><span class="unit-num" id="cd-secs">00</span><span class="unit-label">Seconds</span></div>
  </div>

  <div class="progress-wrap">
    <div class="progress-meta">
      <span>Progress</span>
      <span id="pct-label">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="pbar" style="width:0%"></div>
    </div>
  </div>

  <p class="notify-label">Get notified on launch day</p>
  <div class="notify-form">
    <input class="notify-input" type="email" placeholder="Enter your email address" id="email-in"/>
    <button class="notify-btn" onclick="handleNotify()">Notify Me</button>
  </div>

  <p class="footer">© 2026 <span>Growzio</span> · All rights reserved</p>
</div>

<script>
  const LAUNCH = new Date('2026-07-05T00:00:00').getTime();
  // Start date used for progress bar (project start estimate)
  const START = new Date('2026-06-01T00:00:00').getTime();

  function pad(n){ return String(n).padStart(2,'0'); }

  function tick(){
    const now = Date.now();
    const diff = LAUNCH - now;

    if(diff <= 0){
      document.getElementById('cd-days').textContent  = '00';
      document.getElementById('cd-hours').textContent = '00';
      document.getElementById('cd-mins').textContent  = '00';
      document.getElementById('cd-secs').textContent  = '00';
      document.getElementById('pbar').style.width = '100%';
      document.getElementById('pct-label').textContent = '100%';
      return;
    }

    const days  = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const mins  = Math.floor((diff % 3600000)  / 60000);
    const secs  = Math.floor((diff % 60000)    / 1000);

    const setTick = (id, val) => {
      const el = document.getElementById(id);
      const newVal = pad(val);
      if(el.textContent !== newVal){
        el.classList.add('tick');
        el.textContent = newVal;
        setTimeout(() => el.classList.remove('tick'), 300);
      }
    };

    setTick('cd-days',  days);
    setTick('cd-hours', hours);
    setTick('cd-mins',  mins);
    setTick('cd-secs',  secs);

    // Progress bar
    const total = LAUNCH - START;
    const elapsed = now - START;
    const pct = Math.min(100, Math.max(0, Math.round((elapsed / total) * 100)));
    document.getElementById('pbar').style.width = pct + '%';
    document.getElementById('pct-label').textContent = pct + '%';
  }

  tick();
  setInterval(tick, 1000);

  function handleNotify(){
    const inp = document.getElementById('email-in');
    const val = inp.value.trim();
    if(!val || !val.includes('@')){
      inp.style.borderColor = '#f87171';
      setTimeout(() => inp.style.borderColor = '', 1200);
      return;
    }
    inp.value = '';
    const btn = document.querySelector('.notify-btn');
    btn.textContent = '✓ You\'re on the list!';
    btn.style.background = '#86efac';
    setTimeout(() => { btn.textContent = 'Notify Me'; btn.style.background = ''; }, 3000);
  }
</script>
</body>
</html>
